# House: scenes and security | rooms (light + blinds) | climate.
title: House
path: house
theme: Frame
type: custom:grid-layout
layout:
  grid-template-columns: 88px minmax(0, 1fr)
  grid-template-rows: 100vh
  grid-template-areas: '"rail main"'
  mediaquery:
    "(max-width: 767px)":
      grid-template-columns: minmax(0, 1fr)
      grid-template-rows: 56px auto
      grid-template-areas: '"rail" "main"'
  margin: 0
  padding: 0
  card_margin: 0
cards:
  - type: custom:button-card
    template: frame_rail
    view_layout:
      grid-area: rail

  - type: custom:layout-card
    layout_type: custom:grid-layout
    view_layout:
      grid-area: main
    layout:
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr) minmax(0, 0.95fr)
      grid-template-rows: 1fr
      grid-gap: 20px
      height: calc(100vh - 48px)
      padding: 24px
      mediaquery:
        "(max-width: 767px)":
          grid-template-columns: minmax(0, 1fr)
          grid-template-rows: none
          height: auto
          padding: 16px
      margin: 0
      card_margin: 0
    cards:
      # ------------------------------------------------------------ scenes & security
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout: &column
          grid-template-columns: minmax(0, 1fr)
          grid-auto-rows: min-content
          grid-gap: 12px
          margin: 0
          padding: 0
          card_margin: 0
        cards:
          - type: custom:button-card
            template: frame_heading
            variables:
              title: Scenes

          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(2, minmax(0, 1fr))
              grid-auto-rows: 72px
              grid-gap: 8px
              margin: 0
              padding: 0
              card_margin: 0
            cards:
              - type: custom:button-card
                template: frame_scene
                entity: scene.good_morning
                variables:
                  name: Good morning
                  icon: mdi:weather-sunset-up
              - type: custom:button-card
                template: frame_scene
                entity: scene.good_night
                variables:
                  name: Good night
                  icon: mdi:weather-night
              # dark while all of these are on, else "2 of 4 on"
              - type: custom:button-card
                template: frame_scene
                entity: script.lights_on
                variables:
                  name: Lights on
                  icon: mdi:lightbulb-group-outline
                  kind: "on"
                  sub: All on
                  lights: &lights
                    - light.living_room
                    - light.dining_room
                    - light.kitchen
                    - light.office
              - type: custom:button-card
                template: frame_scene
                entity: script.lights_off
                variables:
                  name: Lights off
                  icon: mdi:lightbulb-group-off-outline
                  kind: "off"
                  lights: *lights

          - type: custom:button-card
            template: frame_heading
            variables:
              title: Security

          - type: custom:button-card
            template: frame_lock
            entity: lock.front_door
            variables:
              door: binary_sensor.front_door
              battery: binary_sensor.front_door_lock_battery

          - type: custom:button-card
            template: frame_openings

      # ------------------------------------------------------------ rooms
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout: *column
        cards:
          - type: custom:button-card
            template: frame_heading
            variables:
              title: Rooms
              sub: Lights & blinds

          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(2, minmax(0, 1fr))
              grid-auto-rows: 72px
              grid-gap: 8px
              margin: 0
              padding: 0
              card_margin: 0
            cards:
              - type: custom:button-card
                template: frame_scene
                entity: script.blinds_up
                variables:
                  name: Blinds up
                  icon: mdi:window-shutter-open
                  kind: open
                  covers: &covers
                    - cover.living_room_window
                    - cover.living_room_door
                    - cover.dining_room_window
                    - cover.kitchen_window
                    - cover.office_window
              - type: custom:button-card
                template: frame_scene
                entity: script.blinds_down
                variables:
                  name: Blinds down
                  icon: mdi:window-shutter
                  kind: close
                  covers: *covers

          # Light on the left (tap toggles, drag dims, hold for details), as tall as the blinds of the room
          # on the right. `branch` draws the line from the light to each blind.
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(2, minmax(0, 1fr))
              grid-auto-rows: minmax(52px, auto)
              grid-gap: 8px 0
              margin: 0
              padding: 0
              card_margin: 0
            cards:
              - type: custom:button-card
                template: frame_light
                entity: light.living_room
                view_layout:
                  grid-row: span 2
                variables:
                  name: Living room
                  icon: mdi:sofa-outline
              - type: custom:button-card
                template: frame_cover
                entity: cover.living_room_window
                variables:
                  name: Window
                  branch: first
              - type: custom:button-card
                template: frame_cover
                entity: cover.living_room_door
                variables:
                  name: Patio door
                  branch: last

              - type: custom:button-card
                template: frame_light
                entity: light.dining_room
                variables:
                  name: Dining room
                  icon: mdi:silverware-fork-knife
              - type: custom:button-card
                template: frame_cover
                entity: cover.dining_room_window
                variables:
                  name: Window
                  branch: only

              - type: custom:button-card
                template: frame_light
                entity: light.kitchen
                variables:
                  name: Kitchen
                  icon: mdi:countertop-outline
              - type: custom:button-card
                template: frame_cover
                entity: cover.kitchen_window
                variables:
                  name: Window
                  branch: only

              - type: custom:button-card
                template: frame_light
                entity: light.office
                variables:
                  name: Office
                  icon: mdi:desk
              - type: custom:button-card
                template: frame_cover
                entity: cover.office_window
                variables:
                  name: Window
                  branch: only

          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(2, minmax(0, 1fr))
              grid-auto-rows: 60px
              grid-gap: 8px
              margin: 0
              padding: 0
              card_margin: 0
            cards:
              - type: custom:button-card
                template: frame_light
                entity: light.bedroom
                variables:
                  name: Bedroom
                  icon: mdi:bed-outline
              - type: custom:button-card
                template: frame_light
                entity: light.kids_room
                variables:
                  name: Kids' room
                  icon: mdi:teddy-bear
              - type: custom:button-card
                template: frame_light
                entity: light.hallway
                variables:
                  name: Hallway
                  icon: mdi:door
              - type: custom:button-card
                template: frame_light
                entity: light.bathroom
                variables:
                  name: Bathroom
                  icon: mdi:shower-head

      # ------------------------------------------------------------ climate
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout: *column
        cards:
          - type: custom:button-card
            template: frame_heading
            variables:
              title: Climate

          - type: custom:button-card
            template: frame_rooms
            variables:
              rooms:
                - name: Outside
                  temp: sensor.outdoor_temperature
                  hum: sensor.outdoor_humidity
                - name: Living room
                  temp: sensor.living_room_temperature
                  hum: sensor.living_room_humidity
                  climate: climate.living_room
                - name: Kitchen
                  temp: sensor.kitchen_temperature
                  hum: sensor.kitchen_humidity
                - name: Office
                  temp: sensor.office_temperature
                  hum: sensor.office_humidity
                - name: Bedroom
                  temp: sensor.bedroom_temperature
                  hum: sensor.bedroom_humidity
                  climate: climate.bedroom
                - name: Kids' room
                  temp: sensor.kids_room_temperature
                  hum: sensor.kids_room_humidity

          - type: custom:button-card
            template: frame_stats
            variables:
              title: Air
              items:
                - label: CO₂
                  entity: sensor.office_co2
                  warn_above: 1000
                - label: Fine dust
                  entity: sensor.pm25
                  warn_above: 25
                - label: Humidity
                  entity: sensor.bathroom_humidity
                  warn_above: 70
