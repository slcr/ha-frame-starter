# Frame – a wall dashboard in paper & ink.
#
# Copy this folder to /config/frame and register it in configuration.yaml (docs/getting-started.md):
#   lovelace:
#     dashboards:
#       dashboard-frame:
#         mode: yaml
#         filename: frame/frame.yaml
#         title: Frame
#         icon: mdi:view-dashboard-variant-outline
#         show_in_sidebar: true
#
# Optional: kiosk-mode (HACS) hides HA's header and sidebar. Add ?disable_km to the URL to edit.
kiosk_mode:
  hide_header: true
  hide_sidebar: true

# Every file in templates/ and views/ is loaded. Optional modules (optional/* in the repo) add files there.
button_card_templates: !include_dir_merge_named templates

# Views in file name order (10-home, 20-house, ...). The rail lists them with their title and icon.
views: !include_dir_merge_list views
