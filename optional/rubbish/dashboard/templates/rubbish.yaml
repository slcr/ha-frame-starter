# Rubbish collection (optional/rubbish): the next pickups from a calendar, with painted bins.
# Works with any calendar whose events name the bin: Waste Collection Schedule (HACS) creates one, a
# local calendar you fill yourself works too. Put the card on Home (see optional/rubbish/README.md).
#
#   Normal:          the next `groups` pickup days, bins and day ("Wednesday · in 4 days")
#   Evening before (and the morning of the pickup, until `out_until`): indigo "Put out tonight" with a
#                    "Done" button. After that, "out" with a tick until the pickup day ends.
# "Done" is remembered on this device. Set `done_helper` (an input_datetime) to share it between devices.
frame_bins:
  template: frame
  update_timer: 5min
  variables:
    calendar: calendar.waste_collection
    days: 21
    groups: 2
    # the pickup counts until this hour on its day
    out_until: 8
    done_helper: ""
    title: ""
    # match: text in the event title (case-insensitive); img: picture in www/frame/bins (or icon, or just a colour)
    # out: false for things you don't put out (e.g. a hazardous waste truck)
    bins:
      - match: general
        label: General waste
        color: "#5B5F66"
        img: /local/frame/bins/grey.webp
      - match: recycl
        label: Recycling
        color: "#FFB000"
        img: /local/frame/bins/yellow.webp
      - match: paper
        label: Paper
        color: "#2D5BFF"
        img: /local/frame/bins/blue.webp
      - match: garden
        label: Garden waste
        color: "#00A36C"
        img: /local/frame/bins/green.webp
      - match: hazard
        label: Hazardous waste
        color: "#8B5A2B"
        img: /local/frame/bins/hazardous.webp
        out: false
  custom_fields:
    body: |
      [[[
        const fx = variables.fx;
        if (!fx) return '';
        const T = (k, d) => (variables.text || {})[k] || d;
        const now = new Date(), t0 = fx.day0(now);
        const evs = fx.events(t0, fx.day0(t0, variables.days), [{ entity: variables.calendar, who: 'bins' }]) || [];
        const list = evs.filter((e) => { const d = fx.day0(e.from); return d > t0 || (d.getTime() === t0.getTime() && now.getHours() < variables.out_until); });
        const groups = [];
        list.forEach((e) => {
          const d = fx.day0(e.from), g = groups.find((x) => x.d.getTime() === d.getTime());
          if (g) g.items.push(e); else groups.push({ d, items: [e] });
        });
        const title = variables.title || T('bins_title', 'Rubbish collection');
        if (!groups.length) return `<div class="blk"><div class="label">${fx.esc(title)}</div><div class="free"><i>${T('bins_none', 'No pickup')}</i> ${T('bins_none_sub', 'coming up')}</div></div>`;
        const diff = (d) => Math.round((d - t0) / 864e5);
        const when = (d) => { const n = diff(d); return n === 0 ? fx.t('today') : n === 1 ? fx.t('tomorrow') : `${fx.weekday(d)} · ${T('bins_in', 'in {0} days').replace('{0}', n)}`; };
        const kind = (title) => variables.bins.find((b) => title.toLowerCase().includes(String(b.match).toLowerCase())) || { label: title, color: '#7A756B' };
        const bin = (k) => (k.img ? `<img class="tonne" src="${fx.esc(k.img)}" alt="">`
          : k.icon ? `<ha-icon class="tonne" icon="${k.icon}" style="color:${k.color}"></ha-icon>`
          : `<svg class="tonne" viewBox="0 0 24 30" aria-hidden="true"><rect x="9" y="0.5" width="6" height="2.5" rx="1.2" fill="${k.color}"/>
              <rect x="1.5" y="2.5" width="21" height="5" rx="1.6" fill="${k.color}"/><rect x="1.5" y="2.5" width="21" height="5" rx="1.6" fill="#000" opacity=".22"/>
              <path d="M3.5 7.5h17l-1.7 18.5H5.2z" fill="${k.color}"/><path d="M8.5 10.5v12M12 10.5v12M15.5 10.5v12" stroke="#FFF" stroke-opacity=".28" stroke-width="1.3" stroke-linecap="round"/>
              <circle cx="7" cy="27" r="2.6" fill="#111"/><circle cx="17" cy="27" r="2.6" fill="#111"/></svg>`);
        const kinds = (g) => [...new Map(g.items.map((e) => { const k = kind(e.title); return [k.label, k]; })).values()];
        // "done": this device (localStorage) or a shared input_datetime
        const first = groups[0], n0 = diff(first.d), key = `bins:${first.d.getTime()}`;
        let doneLocal = false;
        try { doneLocal = !!JSON.parse(localStorage.getItem('frame-done') || '{}')[key]; } catch (e) { /* private mode */ }
        const helperTs = variables.done_helper && states[variables.done_helper] && states[variables.done_helper].attributes.timestamp;
        window.__frameBinsDone = window.__frameBinsDone || ((el, ev) => {
          ev.stopPropagation();
          el.disabled = true;
          const host = el.getRootNode().host;
          if (el.dataset.helper) {
            window.__frameHass.callService('input_datetime', 'set_datetime', { entity_id: el.dataset.helper, timestamp: Math.floor(Date.now() / 1000) })
              .then(() => setTimeout(() => host && host.requestUpdate('_config'), 400), () => { el.disabled = false; });
            return;
          }
          try {
            const m = JSON.parse(localStorage.getItem('frame-done') || '{}');
            m[el.dataset.key] = Date.now();
            Object.keys(m).forEach((k) => { if (Date.now() - m[k] > 7 * 864e5) delete m[k]; });
            localStorage.setItem('frame-done', JSON.stringify(m));
          } catch (e) { /* private mode */ }
          if (host) host.requestUpdate('_config');
        });
        const outs = kinds(first).filter((k) => k.out !== false);
        const due = n0 <= 1 && outs.length > 0;
        const out = due && (doneLocal || (helperTs && helperTs * 1000 > first.d.getTime() - 864e5));
        const rows = groups.slice(0, variables.groups).map((g, i) => {
          const ks = kinds(g);
          return `<div class="bin-grp mu-grp"><div class="mu-pics">${ks.map((k, j) => `<span class="mu-pic" style="--i:${j}">${bin(k)}</span>`).join('')}</div>
            <div class="bin-items">${ks.map((k) => `<div class="bin"><span>${fx.esc(k.label)}</span></div>`).join('')}</div>
            <span class="bin-when">${i === 0 && out ? `<ha-icon icon="mdi:check"></ha-icon> ${T('bins_out', 'out')}` : when(g.d)}</span></div>`;
        }).join('');
        const head = due && !out
          ? `<div class="fold-head"><span class="label">${n0 === 0 ? T('bins_now', 'Put out now') : T('bins_tonight', 'Put out tonight')}</span>
              <button class="ok-btn ok-btn--sm" data-key="${key}"${variables.done_helper ? ` data-helper="${variables.done_helper}"` : ''} onpointerup="__frameBinsDone(this,event)"><ha-icon icon="mdi:check"></ha-icon>${T('bins_done', 'Done')}</button></div>`
          : `<div class="label">${fx.esc(title)}</div>`;
        return `<div class="blk mu${due && !out ? ' blk--due' : ''}">${head}<div class="bins">${rows}</div></div>`;
      ]]]
